services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrovalle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrovalle"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/agrovalle
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
      APP_JWT_SECRET: ${JWT_SECRET:-agrovalle-connect-docker-secret-key-change-in-production}
      # true solo para una demo local con datos de ejemplo; en produccion usar false.
      APP_SEED_DEMO_DATA: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
