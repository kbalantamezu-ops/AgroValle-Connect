spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:agrovalle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# JWT fijo para las pruebas automatizadas.
app.jwt.secret=test-secret-key-agrovalle-connect-at-least-32-characters
app.jwt.expiration-minutes=120
app.jwt.issuer=agrovalle-connect
