spring.application.name=agrovalle-connect

# Base de datos local (H2 en memoria) para desarrollo.
# Para PostgreSQL usa el perfil: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
spring.datasource.url=jdbc:h2:mem:agrovalle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# JWT (cambia APP_JWT_SECRET en produccion; minimo 32 caracteres)
app.jwt.secret=${APP_JWT_SECRET:agrovalle-connect-dev-secret-key-change-in-production-2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:120}
app.jwt.issuer=agrovalle-connect
