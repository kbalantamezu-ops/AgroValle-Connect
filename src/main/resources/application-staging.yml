spring:
  datasource:
    url: ${STAGING_DB_URL}
    username: ${STAGING_DB_USER}
    password: ${STAGING_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: false

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET_KEY}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    issuer: agrovalle-connect
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
