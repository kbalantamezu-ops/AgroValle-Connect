spring.datasource.url=jdbc:postgresql://localhost:5432/agrovalle
spring.datasource.username=postgres
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# En produccion no se cargan datos de ejemplo. Usa APP_SEED_DEMO_DATA=true solo para demos.
app.seed-demo-data=false

# En PostgreSQL el secreto JWT es obligatorio (minimo 32 caracteres).
app.jwt.secret=${APP_JWT_SECRET}

# La consola H2 no se expone fuera del perfil de desarrollo.
spring.h2.console.enabled=false
